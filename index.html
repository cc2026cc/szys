<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>熊猫创意 · 数字艺术作品展</title>
    <script src="https://cdn.jsdelivr.net/npm/blurhash@2.0.5/dist/blurhash.umd.js"></script>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        :root {
            --bg: #04040a;
            --bg2: #08080f;
            --bg3: #0d0d18;
            --gold: #c9a84c;
            --gold-l: #e8c97a;
            --gold-d: rgba(201, 168, 76, 0.1);
            --bamboo: #7c9f4b;
            --t1: #ede9e3;
            --t2: #6e6a78;
            --t3: #302e3a;
            --b-gold: rgba(201, 168, 76, 0.14);
            --b-sub: rgba(255, 255, 255, 0.05);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--t1);
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        /* 禁用所有点击高亮 */
        a, button, div, img, span, svg, * {
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 55% 45% at 10% 20%, rgba(124, 159, 75, 0.04) 0%, transparent 65%),
                radial-gradient(ellipse 45% 55% at 90% 80%, rgba(201, 168, 76, 0.04) 0%, transparent 65%),
                radial-gradient(ellipse 35% 35% at 60% 40%, rgba(79, 195, 247, 0.02) 0%, transparent 55%);
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.018;
            background-image:
                linear-gradient(rgba(124, 159, 75, 1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 159, 75, 1) 1px, transparent 1px);
            background-size: 72px 72px;
        }

        /* ===== 顶部导航 ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            height: 66px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(4, 4, 10, 0.28);
            backdrop-filter: blur(32px) saturate(2);
            -webkit-backdrop-filter: blur(32px) saturate(2);
            border-bottom: 1px solid rgba(124, 159, 75, 0.12);
        }
        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%, rgba(124, 159, 75, 0.5) 25%,
                    rgba(201, 168, 76, 0.6) 50%, rgba(124, 159, 75, 0.5) 75%, transparent 100%);
        }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 28px; width: auto; object-fit: contain; flex-shrink: 0; }
        .logo-words { display: flex; flex-direction: column; justify-content: center; }
        .logo-cn {
            font-size: 16px; font-weight: 700; letter-spacing: 6px; line-height: 1;
            background: linear-gradient(90deg, var(--gold-l) 0%, var(--bamboo) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo-en { font-size: 9px; letter-spacing: 3px; color: var(--t2); line-height: 1; margin-top: 2px; }

        .wechat-btn {
            display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 12px;
            border: 2px solid var(--b-gold); border-radius: 30px; cursor: pointer;
            transition: all 0.35s ease; background: transparent; text-decoration: none;
            position: relative; overflow: hidden; height: 40px; flex-shrink: 0;
        }
        .wechat-btn::before {
            content: ''; position: absolute; inset: 0; border-radius: 30px;
            background: linear-gradient(135deg, var(--gold-d), transparent); opacity: 0; transition: opacity 0.3s;
        }
        .wechat-btn:hover::before { opacity: 1; }
        .wechat-btn:hover { border-color: var(--gold); }
        .wechat-btn svg { width: 22px; height: 22px; fill: var(--gold-l); filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.4)); position: relative; z-index: 1; flex-shrink: 0; }
        .wechat-words { display: flex; flex-direction: column; position: relative; z-index: 1; line-height: 1.2; }
        .wechat-tag { font-size: 8px; letter-spacing: 2px; color: var(--t2); }
        .wechat-id { font-size: 12px; font-weight: 600; color: var(--gold-l); letter-spacing: 1px; }

        /* ===== 分节标题 ===== */
        .sec-head {
            position: relative; z-index: 1; padding: 100px 52px 0; margin-bottom: 52px;
            display: flex; align-items: center; gap: 22px;
        }
        .sec-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--b-gold), transparent); }
        .sec-dmd { width: 7px; height: 7px; border: 1px solid var(--bamboo); transform: rotate(45deg); flex-shrink: 0; }
        .sec-words { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; text-align: center; }
        .sec-label { font-size: 9px; letter-spacing: 5px; color: var(--bamboo); }
        .sec-title { font-size: 20px; font-weight: 300; letter-spacing: 10px; color: var(--gold-l); padding-left: 10px; }

        /* ===== 作品网格 ===== */
        .gallery { position: relative; z-index: 1; padding: 0 52px 130px; }
        .g-grid { display: flex; align-items: flex-start; gap: 18px; }
        .g-col { flex: 1; display: flex; flex-direction: column; gap: 18px; width: 0; }
        .art-card {
            position: relative; border-radius: 6px; overflow: hidden; cursor: pointer;
            background: var(--bg3); border: 1px solid var(--b-sub);
            transition: border-color 0.4s, box-shadow 0.4s; animation: fadeUp 0.7s ease both;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
        .art-card:hover { border-color: rgba(124, 159, 75, 0.35); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 40px rgba(124, 159, 75, 0.06); }
        .img-wrap { position: relative; overflow: hidden; width: 100%; }
        .img-wrap img {
            display: block; width: 100%; height: auto;
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s;
            filter: brightness(0.9) saturate(0.95);
        }
        .art-card:hover .img-wrap img { transform: scale(1.05); filter: brightness(1.02) saturate(1.1); }

        .art-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 76px;
            background: rgba(180, 130, 70, 0.28); backdrop-filter: blur(3px) saturate(1.3);
            -webkit-backdrop-filter: blur(3px) saturate(1.3); border-top: 1px solid rgba(255, 230, 180, 0.35);
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 100%);
            pointer-events: none; z-index: 1; border-radius: 0 0 6px 6px;
        }
        .art-info { position: absolute; bottom: 0; left: 0; right: 85px; z-index: 3; pointer-events: none; padding: 14px 16px 14px 14px; }
        .art-series {
            display: flex; align-items: center; gap: 8px; font-size: 9px; font-weight: 500;
            letter-spacing: 3px; color: #f0d88a; margin-bottom: 6px;
        }
        .art-series::before { content: ''; width: 14px; height: 1px; background: #e2c87a; opacity: 0.9; }
        .art-title-text { font-size: 15px; font-weight: 500; letter-spacing: 3px; color: var(--t1); margin-bottom: 3px; line-height: 1.3; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
        .art-meta-text { font-size: 10px; letter-spacing: 2px; color: #ffe9b0; font-weight: 500; }
        .art-buy {
            position: absolute; bottom: 22px; right: 16px; z-index: 5; padding: 7px 16px;
            background: rgba(220, 180, 100, 0.18); backdrop-filter: blur(10px) saturate(1.4);
            -webkit-backdrop-filter: blur(10px) saturate(1.4); border: 1px solid rgba(220, 180, 100, 0.5);
            color: #fff6e0; font-size: 10px; font-weight: 500; letter-spacing: 2px;
            cursor: pointer; font-family: inherit; border-radius: 4px;
            transition: all 0.25s ease; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); line-height: 1.2;
        }
        .art-buy:hover {
            background: rgba(220, 180, 100, 0.35); border-color: rgba(220, 180, 100, 0.8);
            color: #ffffff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* ===== 灯箱 ===== */
        .lightbox { position: fixed; inset: 0; z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.45s ease; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox.is-mobile .lb-nav, .lightbox.is-mobile .lb-card-wrap,
        .lightbox.is-mobile .lb-version-bar, .lightbox.is-mobile .lb-dots, .lightbox.is-mobile .lb-panel { display: none !important; }

        .lb-bg { position: absolute; inset: 0; background: rgba(2, 2, 6, 0.96); backdrop-filter: blur(28px); }
        .lb-layout { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: stretch; }
        .lb-nav { width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .lb-nav-btn {
            width: 44px; height: 44px; border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 15, 25, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #c9a84c; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.25s; border-radius: 50%;
        }
        .lb-nav-btn svg { width: 20px; height: 20px; stroke: currentColor; }
        .lb-nav-btn:hover { border-color: var(--bamboo); background: rgba(124, 159, 75, 0.2); color: var(--bamboo); box-shadow: 0 0 18px rgba(124, 159, 75, 0.25); }
        .lb-stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 0 40px; overflow: hidden; position: relative; }
        .lb-card-wrap { display: flex; align-items: center; justify-content: center; flex: 1; width: 100%; }
        .lb-card { position: relative; flex-shrink: 0; will-change: transform, opacity; }
        .lb-card img {
            display: block; max-width: 88vw; max-height: 84vh; width: auto; height: auto;
            object-fit: contain; border-radius: 4px; border: 1px solid rgba(124, 159, 75, 0.35);
            box-shadow: 0 48px 130px rgba(0, 0, 0, .85), 0 0 80px rgba(124, 159, 75, 0.06);
        }
        @keyframes zoomIn { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .lb-card.enter { animation: zoomIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes outLeft { 0% { transform: translateX(0) scale(1); opacity: 1; } 100% { transform: translateX(-45%) scale(0.93); opacity: 0; } }
        @keyframes outRight { 0% { transform: translateX(0) scale(1); opacity: 1; } 100% { transform: translateX(45%) scale(0.93); opacity: 0; } }
        @keyframes inFromRight { 0% { transform: translateX(45%) scale(0.93); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes inFromLeft { 0% { transform: translateX(-45%) scale(0.93); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        .lb-card.out-l { animation: outLeft 0.3s cubic-bezier(0.4, 0, 1, 1) forwards; }
        .lb-card.out-r { animation: outRight 0.3s cubic-bezier(0.4, 0, 1, 1) forwards; }
        .lb-card.in-r { animation: inFromRight 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .lb-card.in-l { animation: inFromLeft 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .lb-version-bar { display: flex; gap: 10px; margin-top: 16px; z-index: 10; }
        .lb-ver-btn {
            padding: 6px 18px; border: 1px solid var(--b-gold); background: rgba(4, 4, 10, 0.6);
            backdrop-filter: blur(10px); color: var(--gold); font-size: 10px; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s; border-radius: 2px; font-family: inherit;
        }
        .lb-ver-btn.active { background: rgba(124, 159, 75, 0.15); border-color: var(--bamboo); color: var(--bamboo); }
        .lb-dots { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
        .lb-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.25); border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer; transition: all .3s; }
        .lb-dot.on { background: var(--bamboo); width: 10px; height: 10px; border-color: var(--bamboo); box-shadow: 0 0 10px rgba(124, 159, 75, 0.9); }

        /* PC 右侧面板 */
        .lb-panel { width: 310px; flex-shrink: 0; padding: 0 36px 0 8px; display: flex; flex-direction: column; justify-content: center; }
        .lb-info { margin-bottom: 24px; }
        .lb-tag-row { display: flex; align-items: center; gap: 10px; font-size: 9px; letter-spacing: 3px; color: var(--bamboo); margin-bottom: 14px; position: relative; z-index: 2; }
        .lb-tag-row::before { content: ''; width: 18px; height: 1px; background: var(--bamboo); }
        .lb-ghost-num { font-size: 88px; font-weight: 200; line-height: 1; color: rgba(124, 159, 75, 0.12); margin-bottom: -10px; letter-spacing: -4px; user-select: none; z-index: 0; position: relative; }
        .lb-art-name { font-size: 26px; font-weight: 600; letter-spacing: 5px; color: var(--t1); margin-bottom: 10px; position: relative; z-index: 2; }
        .lb-art-desc { font-size: 11px; color: var(--t2); letter-spacing: 1.5px; line-height: 2.1; margin-bottom: 18px; }
        .lb-art-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
        .lb-chip { padding: 3px 10px; border: 1px solid var(--b-sub); font-size: 8px; letter-spacing: 2px; color: var(--t2); border-radius: 2px; }
        .lb-story { margin-top: 16px; border-top: 1px solid var(--b-sub); padding-top: 16px; }
        .lb-story-title { font-size: 9px; letter-spacing: 4px; color: var(--bamboo); margin-bottom: 10px; text-transform: uppercase; }
        .lb-story-text { font-size: 11px; color: var(--t2); line-height: 1.9; letter-spacing: 1px; }
        .btn-collect { width: 100%; padding: 14px; margin-top: 24px; background: linear-gradient(135deg, var(--bamboo) 0%, #9bbf6a 100%); border: none; border-radius: 3px; color: #0a0f05; font-size: 12px; font-weight: 700; letter-spacing: 5px; cursor: pointer; font-family: inherit; transition: all 0.3s; }
        .btn-collect:hover { box-shadow: 0 8px 32px rgba(124, 159, 75, 0.45); transform: translateY(-1px); }

        .lb-close {
            position: absolute; top: 20px; right: 20px; z-index: 20; width: 32px; height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(4, 4, 10, 0.35);
            color: rgba(255, 255, 255, 0.45); cursor: pointer; font-size: 14px;
            backdrop-filter: blur(10px); border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .lb-close:hover { border-color: var(--bamboo); color: var(--bamboo); }

        /* ============================================================
           手机端专用 (宽度 < 1100px)
           ============================================================ */
        @media (max-width: 1100px) {
            .lb-close {
                width: 34px; height: 34px; font-size: 15px; top: 12px; right: 12px;
                background: rgba(0, 0, 0, 0.32); border-color: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.5);
                border-radius: 50%; z-index: 30; backdrop-filter: blur(8px); -webkit-tap-highlight-color: transparent !important;
            }
            .lb-close:active { border-color: var(--bamboo); color: var(--bamboo); transform: scale(0.92); }
            .lb-stage { padding: 0 !important; flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
            .lb-mobile-container { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; background: var(--bg); }

            /* ---- 图片区域 (顶部对齐) ---- */
            .lb-mobile-img-area {
                position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                display: flex; align-items: flex-start; justify-content: center; z-index: 5;
                will-change: transform; cursor: pointer; -webkit-tap-highlight-color: transparent !important; pointer-events: auto;
            }
            .lb-mobile-img-area .lb-card {
                width: 100%; height: 100%; display: flex; align-items: flex-start; justify-content: center;
                transform: translateY(0) scale(1); transform-origin: top center; will-change: transform; transition: none; position: relative;
            }
            .lb-mobile-img-area .lb-card img {
                max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain;
                border: none; box-shadow: none; border-radius: 0; display: block; max-width: 100%; max-height: 100%;
                -webkit-tap-highlight-color: transparent !important; transform-origin: top center;
            }

            /* 手机端无 txt 模式强制居中 */
            .lb-mobile-container.no-story-mode .lb-mobile-img-area {
                align-items: center; /* 让图片垂直居中 */
            }
            .lb-mobile-container.no-story-mode .lb-mobile-img-area .lb-card {
                align-items: center;
            }
            .lb-mobile-container.no-story-mode .lb-mobile-info-area {
                display: none !important;
            }
            .lb-mobile-container.no-story-mode .lb-mobile-buy-fixed {
                display: none !important;
            }

            /* 手机端精简工具条（半透明毛玻璃效果） */
            .lb-mobile-simple-bar {
                display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
                width: 88%; height: 58px; background: rgba(20, 20, 30, 0.55);
                backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: 12px; z-index: 20;
                padding: 0 16px; justify-content: space-between; align-items: center;
                box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.15);
            }
            .lb-mobile-container.no-story-mode .lb-mobile-simple-bar { display: flex; }
            .lb-mobile-simple-bar .ms-title {
                color: var(--bamboo); font-size: 15px; font-weight: 600; letter-spacing: 2px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
            }
            .lb-mobile-simple-bar .ms-buy {
                padding: 8px 20px; background: rgba(20, 20, 30, 0.75); border: 1px solid rgba(201, 168, 76, 0.4);
                border-radius: 30px; color: var(--gold-l); font-size: 13px; font-weight: 600; cursor: pointer;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); font-family: inherit; transition: transform 0.2s;
            }
            .lb-mobile-simple-bar .ms-buy:active { transform: scale(0.95); }

            /* ---- 圆形横竖版切换按钮 ---- */
            .lb-mobile-version-switch { position: absolute; right: 12px; top: 136px; z-index: 15; display: flex; flex-direction: column; gap: 8px; pointer-events: none; -webkit-tap-highlight-color: transparent !important; }
            .lb-mobile-version-switch button {
                width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: rgba(255, 255, 255, 0.7); font-size: 14px;
                font-weight: 600; display: flex; align-items: center; justify-content: center; line-height: 1; padding: 0; margin: 0;
                cursor: pointer; pointer-events: auto; transition: all 0.25s ease; -webkit-tap-highlight-color: transparent !important; user-select: none;
            }
            .lb-mobile-version-switch button:active { transform: scale(0.88); }
            .lb-mobile-version-switch button.active { border-color: var(--bamboo); color: var(--bamboo); background: rgba(124, 159, 75, 0.2); box-shadow: 0 0 16px rgba(124, 159, 75, 0.15); }

            /* ---- 信息区域 (紧贴图片底部) ---- */
            .lb-mobile-info-area {
                position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(8, 8, 15, 0.88);
                backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); border-top: 1px solid rgba(124, 159, 75, 0.15);
                border-radius: 16px 16px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
                padding: 16px 20px 20px; box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.4); -webkit-tap-highlight-color: transparent !important;
                will-change: top, height; transition: none; opacity: 1;
            }
            .lb-mobile-info-area .info-inner { padding-bottom: 10px; }
            .lb-mobile-info-area .mi-title { font-size: 22px; font-weight: 600; letter-spacing: 3px; color: var(--t1); margin-bottom: 2px; }
            .lb-mobile-info-area .mi-num { font-size: 12px; color: var(--bamboo); letter-spacing: 2px; margin-bottom: 12px; }
            .lb-mobile-info-area .mi-desc { font-size: 13px; color: var(--t2); line-height: 1.8; letter-spacing: 0.5px; margin-bottom: 12px; }
            .lb-mobile-info-area .mi-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
            .lb-mobile-info-area .mi-chip { padding: 4px 12px; border: 1px solid var(--b-sub); font-size: 10px; letter-spacing: 1px; color: var(--t2); border-radius: 2px; }
            .lb-mobile-info-area .mi-story-title { font-size: 10px; letter-spacing: 4px; color: var(--bamboo); margin: 10px 0 6px; text-transform: uppercase; }
            .lb-mobile-info-area .mi-story-text { font-size: 12px; color: var(--t2); line-height: 1.9; letter-spacing: 0.5px; margin-bottom: 10px; }

            /* ---- 底部购买按钮 (固定始终显示，精致紧凑) ---- */
            .lb-mobile-buy-fixed {
                position: fixed; bottom: 0; left: 0; right: 0; z-index: 25; padding: 12px 20px 20px;
                background: linear-gradient(to top, rgba(4, 4, 10, 0.88) 0%, transparent 100%); pointer-events: auto;
                display: flex; justify-content: center; opacity: 1; -webkit-tap-highlight-color: transparent !important;
            }
            .lb-mobile-buy-fixed button {

        const defaultText = {
            desc: '七仔主题数字艺术作品，融合东方美学与数字绘画，记录每一刻灵感。',
            story: '此作品的创作背景与幕后故事正在由作者精心整理中，敬请期待。',
            chips: ['数字艺术', '七仔', '插画'],
            prices: [19.9, 89, 799]
        };

        function setImageWithBlur(imgElement, highResSrc) {
            if (!imgElement) return;
            imgElement.src = highResSrc;
        }

        // ==========================================
        // 加载作品
        // ==========================================
        async function loadWorksFromGitHub() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<p style="color:#888; text-align:center; padding:40px; grid-column: span 12;">正在加载最新作品...</p>';

            let folders = [];
            const timestamp = new Date().getTime();

            try {
                const repoRes = await fetch(`${API_BASE}?t=${timestamp}`);
                if (repoRes.ok) {
                    folders = await repoRes.json();
                }
            } catch (e) {
                console.warn('动态读取目录超时，启用本地结构');
            }

            if (!Array.isArray(folders) || folders.length === 0) {
                folders = [
                    { name: '01财神七仔', type: 'dir' },
                    { name: '02弥勒七仔', type: 'dir' },
                    { name: '03如来七仔', type: 'dir' },
                    { name: '04悟空七仔', type: 'dir' },
                    { name: '05小女孩骑着七仔', type: 'dir' }
                ];
            }

            try {
                let sortedFolders = folders
                    .filter(item => item.type === 'dir' || item.name)
                    .sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

                const promises = sortedFolders.map(async (folder) => {
                    const folderName = folder.name;
                    let files = [];
                    let hasTxt = false;

                    try {
                        const folderUrl = `${API_BASE}/${encodeURIComponent(folderName)}?t=${timestamp}`;
                        const fileRes = await fetch(folderUrl);
                        if (fileRes.ok) {
                            const fileData = await fileRes.json();
                            files = fileData.map(f => f.name);
                        }
                    } catch (e) {}

                    if (files.length === 0) {
                        // 模拟数据 fallback：给部分模拟数据假定存在 txt 方便离线测试
                        if (folderName.includes('01')) { files = ['20260804财神七仔qsq01.webp', '20260804财神版七仔02.webp']; }
                        else if (folderName.includes('02')) { files = ['弥勒七仔mlq01.webp']; }
                        else if (folderName.includes('03')) { files = ['如来七仔rlq01.webp']; }
                        else if (folderName.includes('04')) { files = ['悟空七仔wqkz01.webp']; }
                        else if (folderName.includes('05')) { files = ['小女孩骑着七仔qzqz01.webp']; }
                    }

                    // 异步读取目录下的 TXT 文件内容
                    let txtContent = '';
                    const txtFile = files.find(f => f.toLowerCase().endsWith('.txt'));
                    if (txtFile) {
                        try {
                            const txtRes = await fetch(`./熊猫创意/${encodeURIComponent(folderName)}/${encodeURIComponent(txtFile)}?t=${timestamp}`);
                            if (txtRes.ok) {
                                txtContent = (await txtRes.text()).trim();
                            }
                        } catch (e) {
                            console.warn('读取TXT文档失败:', e);
                        }
                    }

                    let images = files.filter(f => ['jpg', 'jpeg', 'png', 'webp'].includes(f.split('.').pop().toLowerCase()));
                    if (images.length === 0) return null;
                    images.sort();

                    const firstImg = images[0];
                    const nameWithoutExt = firstImg.substring(0, firstImg.lastIndexOf('.'));
                    const match = nameWithoutExt.match(/([\u4e00-\u9fa5]+)([a-zA-Z0-9]*)$/);

                    let extractedName = folderName;
                    let extractedNum = '0000';
                    if (match) {
                        extractedName = match[1];
                        extractedNum = match[2] ? match[2].toUpperCase() : '0000';
                    }

                    const textData = textDataDict[extractedName] || defaultText;
                    
                    // 若存在 TXT 文件且有内容则优先使用 TXT 内容，否则使用配置中的故事文字
                    const finalStory = txtContent || textData.story;
                    if (txtContent) {
                        hasTxt = true;
                    } else {
                        hasTxt = files.some(f => f.toLowerCase().endsWith('.txt'));
                    }

                    const versions = images.map(imgName => {
                        const lower = imgName.toLowerCase();
                        const label = (lower.includes('横') || lower.includes('02')) ? '横版' : '竖版';
                        return { src: `./熊猫创意/${folderName}/${imgName}`, label: label };
                    });
                    
                    // 强制排序：确保“竖版”永远在数组的第一个位置
                    versions.sort((a, b) => {
                        if (a.label === '竖版' && b.label !== '竖版') return -1;
                        if (a.label !== '竖版' && b.label === '竖版') return 1;
                        return 0;
                    });

                    return {
                        name: extractedName,
                        series: '神话系列',
                        num: extractedNum,
                        desc: textData.desc,
                        story: finalStory,
                        chips: textData.chips,
                        prices: textData.prices || defaultText.prices,
                        versions: versions,
                        hasStory: hasTxt // 记录是否包含Txt文档
                    };
                });

                works = (await Promise.all(promises)).filter(Boolean);
                renderGallery();
            } catch (err) {
                console.error('渲染异常:', err);
            }
        }

        // ==========================================
        // 首页网格渲染
        // ==========================================
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const colCount = window.innerWidth <= 900 ? 2 : 3;
            let cols = Array.from({ length: colCount }, () => []);

            works.forEach((w, i) => {
                // 需求：将序号直接写在缩略图下方，“神话系列”后面
                const seriesNumStr = `${w.series} ${String(i+1).padStart(2,'0')}`;
                const cardHTML = `
                <div class="art-card" style="animation-delay: ${i*0.1}s;" onclick="openLB(${i})">
                    <div class="img-wrap">
                        <img id="card-img-${i}" alt="${w.name}" loading="lazy" />
                    </div>
                    <div class="art-overlay"></div>
                    <!-- 原来的悬浮 art-num 已被取消 -->
                    <div class="art-info">
                        <div class="art-series">${seriesNumStr}</div>
                        <div class="art-title-text">${w.name}</div>
                        <div class="art-meta-text">${w.num}</div>
                    </div>
                    <button class="art-buy" onclick="event.stopPropagation(); openPurchase(${i},0)">购买收藏</button>
                </div>`;
                cols[i % colCount].push(cardHTML);
            });

            grid.innerHTML = cols.map(colHTML => `<div class="g-col">${colHTML.join('')}</div>`).join('');

            works.forEach((w, i) => {
                const imgEl = document.getElementById(`card-img-${i}`);
                const firstVer = w.versions[0];
                setImageWithBlur(imgEl, firstVer.src);
            });
        }

        let lastWindowWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => {
                if (window.innerWidth !== lastWindowWidth) {
                    lastWindowWidth = window.innerWidth;
                    if (works.length > 0) renderGallery();
                }
            }, 300);
        });

        // ==========================================
        // 灯箱控制
        // ==========================================
        let isMobile = false;
        let mobileExpanded = false;

        let touchStartY = 0;
        let touchCurrentY = 0;
        let touchStartTime = 0;
        let isDragging = false;
        let dragProgress = 0;
        let isAnimating = false;
        let touchOnInfoArea = false;
        let startProgress = 0;

        let mobileContainer = null;
        let mobileImgCard = null;
        let mobileImg = null;
        let mobileInfoArea = null;
        let mobileVersionSwitch = null;
        let mobileBuyFixed = null;
        let currentImgRatio = 0.70; 
        const BUY_SHOW_PROGRESS = 0.30;

        function openLB(idx) {
            cur = idx;
            curVer = 0;
            isMobile = window.innerWidth < 1100;

            // 打开大图时向浏览器历史压入一条记录，用于手机端侧滑返回
            if (!history.state || !history.state.lightbox) {
                history.pushState({ lightbox: true }, '');
            }

            if (isMobile) {
                document.getElementById('lightbox').classList.add('is-mobile');
                setupMobileLightbox();
                fillMobileInfo(cur, curVer);
                const w = works[cur];
                const v = w.versions[curVer];
                
                if (mobileImg) {
                    setImageWithBlur(mobileImg, v.src);
                }
                
                mobileExpanded = false;
                dragProgress = 0;
                currentImgRatio = 0.70;
                updateMobileTransform(0);
                if (mobileBuyFixed && w.hasStory) {
                    mobileBuyFixed.classList.remove('visible');
                }
                renderMobileVersionSwitch();
                document.getElementById('lightbox').classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                document.getElementById('lightbox').classList.remove('is-mobile');
                fillLB(idx, 0);
                buildDots();
                renderVersionBar();
                document.getElementById('lightbox').classList.add('active');
                document.body.style.overflow = 'hidden';
                const card = document.getElementById('lbCard');
                card.className = 'lb-card';
                void card.offsetWidth;
                card.classList.add('enter');
                card.addEventListener('animationend', () => card.classList.remove('enter'), { once: true });
            }
        }

        function cleanupMobileContainer() {
            if (mobileContainer) {
                mobileContainer.style.display = 'none';
            }
            if (mobileBuyFixed) {
                mobileBuyFixed.style.display = 'none';
                mobileBuyFixed.classList.remove('visible');
            }
            document.getElementById('lightbox').classList.remove('is-mobile');
        }

        function closeLB(fromPopState = false) {
            const lb = document.getElementById('lightbox');
            if (!lb || !lb.classList.contains('active')) return;

            lb.classList.remove('active');
            document.body.style.overflow = '';
            isDragging = false;
            isAnimating = false;
            touchOnInfoArea = false;
            
            if (isMobile) {
                cleanupMobileContainer();
            }

            // 如果是用户主动点击关闭按钮而非手机返回键，则退回刚才压入的历史记录
            if (!fromPopState && history.state && history.state.lightbox) {
                history.back();
            }
        }

        function fillLB(idx, verIdx) {
            const w = works[idx];
            const v = w.versions[verIdx];
            const lbImg = document.getElementById('lbImg');
            setImageWithBlur(lbImg, v.src);

            document.getElementById('lbSeries').textContent = w.series;
            document.getElementById('lbGhost').textContent = w.num;
            document.getElementById('lbName').textContent = w.name;
            
            const lbStoryArea = document.querySelector('.lb-story');

            if (w.hasStory) {
                document.getElementById('lbStory').textContent = w.story;
                lbStoryArea.style.display = 'block';
            } else {
                lbStoryArea.style.display = 'none';
            }
            
            document.querySelectorAll('.lb-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
            document.querySelectorAll('.lb-ver-btn').forEach((b, i) => b.classList.toggle('active', i === verIdx));
        }

        function buildDots() {
            document.getElementById('lbDots').innerHTML = works.map((_, i) =>
                `<div class="lb-dot${i===cur?' on':''}" onclick="jumpTo(${i})"></div>`
            ).join('');
        }

        function renderVersionBar() {
            const bar = document.getElementById('lbVersionBar');
            const w = works[cur];
            bar.innerHTML = w.versions.length > 1 ? w.versions.map((v, i) =>
                `<button class="lb-ver-btn${i===curVer?' active':''}" onclick="switchLBVersion(${i})">${v.label}</button>`
            ).join('') : '';
        }

        function switchLBVersion(verIdx) {
            if (busy || verIdx === curVer) return;
            curVer = verIdx;
            const v = works[cur].versions[verIdx];
            
            if (isMobile) {
                if (mobileImg) {
                    setImageWithBlur(mobileImg, v.src);
                }
                renderMobileVersionSwitch();
            } else {
                setImageWithBlur(document.getElementById('lbImg'), v.src);
                document.querySelectorAll('.lb-ver-btn').forEach((b, i) => b.classList.toggle('active', i === verIdx));
            }
        }

        function nav(dir) {
            if (isMobile) return;
            if (!busy) jumpTo((cur + dir + works.length) % works.length, dir);
        }

        function jumpTo(next, dir) {
            if (busy || next === cur || isMobile) return;
            busy = true;
            const d = dir !== undefined ? dir : (next > cur ? 1 : -1);
            const card = document.getElementById('lbCard');
            const outC = d > 0 ? 'out-l' : 'out-r', inC = d > 0 ? 'in-r' : 'in-l';
            card.className = 'lb-card ' + outC;
            card.addEventListener('animationend', function h() {
                card.removeEventListener('animationend', h);
                cur = next;
                curVer = 0;
                fillLB(cur, 0);
                renderVersionBar();
                card.className = 'lb-card';
                void card.offsetWidth;
                card.classList.add(inC);
                card.addEventListener('animationend', function h2() {
                    card.removeEventListener('animationend', h2);
                    card.classList.remove(inC);
                    busy = false;
                });
            });
        }

        // ==========================================
        // 手机模式
        // ==========================================
        function setupMobileLightbox() {
            const stage = document.getElementById('lbStage');
            let container = document.getElementById('lbMobileContainer');

            if (!container) {
                container = document.createElement('div');
                container.id = 'lbMobileContainer';
                container.className = 'lb-mobile-container';

                const imgArea = document.createElement('div');
                imgArea.className = 'lb-mobile-img-area';
                imgArea.onclick = function(e) {
                    if (mobileExpanded) collapseMobileInfo();
                };
                imgArea.innerHTML = `<div class="lb-card"><img id="lbMobileImg" src="" alt="" /></div>`;
                container.appendChild(imgArea);

                const verSwitch = document.createElement('div');
                verSwitch.className = 'lb-mobile-version-switch';
                verSwitch.id = 'lbMobileVersionSwitch';
                container.appendChild(verSwitch);

                const infoArea = document.createElement('div');
                infoArea.className = 'lb-mobile-info-area';
                infoArea.id = 'lbMobileInfoArea';
                container.appendChild(infoArea);
                
                // 需求：新增低饱和度褐色的小条结构
                const simpleBar = document.createElement('div');
                simpleBar.className = 'lb-mobile-simple-bar';
                simpleBar.id = 'lbMobileSimpleBar';
                container.appendChild(simpleBar);

                stage.appendChild(container);

                container.addEventListener('touchstart', onTouchStart, { passive: true });
                container.addEventListener('touchmove', onTouchMove, { passive: false });
                container.addEventListener('touchend', onTouchEnd, { passive: true });
                infoArea.addEventListener('scroll', checkBuyButtonVisibility, { passive: true });
            }

            mobileContainer = container;
            mobileImgCard = document.querySelector('.lb-mobile-img-area .lb-card');
            mobileImg = document.querySelector('#lbMobileImg');
            mobileInfoArea = document.getElementById('lbMobileInfoArea');
            mobileVersionSwitch = document.getElementById('lbMobileVersionSwitch');

            mobileImg.onload = updateImgRatio;

            mobileContainer.style.display = 'block';
        }

        function updateImgRatio() {
            if (!isMobile || !mobileImg) return;
            const w = works[cur];
            
            // 需求：如果没有 txt 文档，手机大图强制屏幕上下左右居中
            if (!w.hasStory) {
                currentImgRatio = 1.0; 
                updateMobileTransform(0);
                return;
            }

            const aspect = mobileImg.naturalWidth / mobileImg.naturalHeight;
            if (aspect && aspect > 0) {
                const viewW = window.innerWidth;
                const viewH = window.innerHeight;
                let actualH;
                if (viewW / aspect > viewH) actualH = viewH;
                else actualH = viewW / aspect;
                
                let ratio = actualH / viewH;
                ratio = ratio + 0.02;
                currentImgRatio = Math.min(Math.max(ratio, 0.35), 0.70);
            } else {
                currentImgRatio = 0.70;
            }
            updateMobileTransform(dragProgress);
        }

        function collapseMobileInfo() {
            if (!mobileExpanded) return;
            mobileExpanded = false;
            const targetProgress = 0;
            if (mobileImgCard) mobileImgCard.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            if (mobileInfoArea) mobileInfoArea.style.transition = 'height 0.5s cubic-bezier(0.16, 1, 0.3, 1), top 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            if (mobileBuyFixed) mobileBuyFixed.classList.remove('visible');
            
            isAnimating = true;
            updateMobileTransform(0);
            setTimeout(() => { isAnimating = false; }, 550);
            dragProgress = 0;
        }

        function fillMobileInfo(idx, verIdx) {
            const w = works[idx];
            const infoArea = document.getElementById('lbMobileInfoArea');
            const simpleBar = document.getElementById('lbMobileSimpleBar');
            const container = document.getElementById('lbMobileContainer');
            
            if (!infoArea || !container) return;

            if (!w.hasStory) {
                container.classList.add('no-story-mode');
                if(simpleBar) {
                    simpleBar.innerHTML = `
                        <div class="ms-title">${w.name}</div>
                        <button class="ms-buy" onclick="event.stopPropagation(); openPurchaseFromLB()">购买收藏</button>
                    `;
                }
            } else {
                container.classList.remove('no-story-mode');
                infoArea.innerHTML = `
                    <div class="info-inner">
                        <div class="mi-title">${w.name}</div>
                        <div class="mi-num">${w.num}</div>
                        <div class="mi-story-title">创作故事</div>
                        <div class="mi-story-text">${w.story}</div>
                        <button class="btn-collect" style="width:100%; padding:12px; margin-top:16px;" onclick="openPurchaseFromLB()">购买收藏</button>
                    </div>
                `;
            }
        }

        function renderMobileVersionSwitch() {
            const w = works[cur];
            const container = document.getElementById('lbMobileVersionSwitch');
            if (!container) return;
            if (w.versions.length <= 1) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = w.versions.map((v, i) =>
                `<button class="${i===curVer?'active':''}" style="font-size: 14px;" onclick="event.stopPropagation(); switchLBVersion(${i})" ontouchstart="event.stopPropagation()">${i === 0 ? '竖' : '横'}</button>`
            ).join('');
        }

        // ─── 触摸处理 ───
        const DRAG_THRESHOLD = 10;
        let rafId = null;

        function onTouchStart(e) {
            if (e.touches.length !== 1) return;
            const container = document.getElementById('lbMobileContainer');
            // 需求拦截：如果不存在 txt(处于no-story-mode)，直接禁止上滑动效果，固定居中
            if (container && container.classList.contains('no-story-mode')) return;

            if (isAnimating) isAnimating = false;

            const touch = e.touches[0];
            touchStartY = touch.clientY;
            touchCurrentY = touchStartY;
            touchStartTime = Date.now();
            isDragging = false;
            startProgress = dragProgress;
            touchOnInfoArea = false;

            const infoEl = document.getElementById('lbMobileInfoArea');
            if (infoEl) {
                const rect = infoEl.getBoundingClientRect();
                if (touch.clientY >= rect.top && touch.clientY <= rect.bottom &&
                    touch.clientX >= rect.left && touch.clientX <= rect.right) {
                    touchOnInfoArea = true;
                }
            }
            if (mobileImgCard) mobileImgCard.style.transition = 'none';
            if (mobileInfoArea) mobileInfoArea.style.transition = 'none';
        }

        function onTouchMove(e) {
            if (e.touches.length !== 1) return;
            const container = document.getElementById('lbMobileContainer');
            if (container && container.classList.contains('no-story-mode')) return;

            const dy = e.touches[0].clientY - touchStartY;
            touchCurrentY = e.touches[0].clientY;

            if (touchOnInfoArea) {
                const infoEl = document.getElementById('lbMobileInfoArea');
                let shouldIntercept = false;
                if (dy < 0 && startProgress < 1) shouldIntercept = true;
                else if (dy > 0 && infoEl && infoEl.scrollTop <= 0) shouldIntercept = true;
                if (!shouldIntercept) return;
            }

            if (!isDragging) {
                if (Math.abs(dy) > DRAG_THRESHOLD) isDragging = true;
                else return;
            }

            if (!e.cancelable) return;
            e.preventDefault();

            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => {
                const maxDy = window.innerHeight * 0.6;
                const delta = -dy / maxDy;
                let progress = startProgress + delta;
                progress = Math.min(1, Math.max(0, progress));
                dragProgress = progress;
                updateMobileTransform(progress);
            });
        }

        function onTouchEnd(e) {
            const container = document.getElementById('lbMobileContainer');
            if (container && container.classList.contains('no-story-mode')) return;

            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            if (touchOnInfoArea && !isDragging) { touchOnInfoArea = false; return; }
            touchOnInfoArea = false;

            if (!isDragging) return;

            const dy = touchCurrentY - touchStartY;
            const dt = Date.now() - touchStartTime;
            const speed = Math.abs(dy) / dt;

            let targetProgress = dragProgress;
            if (speed > 0.3) {
                if (dy < 0) targetProgress = Math.min(1, dragProgress + 0.2);
                else if (dy > 0) targetProgress = Math.max(0, dragProgress - 0.2);
            }
            if (targetProgress > 0.85) targetProgress = 1;
            if (targetProgress < 0.15) targetProgress = 0;

            mobileExpanded = (targetProgress >= 0.5);

            if (mobileImgCard) mobileImgCard.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            if (mobileInfoArea) mobileInfoArea.style.transition = 'height 0.5s cubic-bezier(0.16, 1, 0.3, 1), top 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            
            if (targetProgress >= BUY_SHOW_PROGRESS) {
                if (mobileBuyFixed) mobileBuyFixed.classList.add('visible');
            } else {
                if (mobileBuyFixed) mobileBuyFixed.classList.remove('visible');
            }

            isAnimating = true;
            updateMobileTransform(targetProgress);
            setTimeout(() => { isAnimating = false; }, 550);
            isDragging = false;
            dragProgress = targetProgress;
        }

        function updateMobileTransform(progress) {
            const w = works[cur];
            if (!w || !w.hasStory) return; // 没有story时维持完全居中，不执行形变代码

            const minR = Math.min(0.30, currentImgRatio * 0.5);
            const scale = 1 - progress * (1 - minR / currentImgRatio);
            if (mobileImgCard) {
                mobileImgCard.style.transform = `scale(${scale})`;
            }

            const imgHeightRatio = currentImgRatio * scale;
            if (mobileInfoArea) {
                const topPercent = imgHeightRatio * 100;
                const heightPercent = 100 - topPercent;
                mobileInfoArea.style.top = topPercent + '%';
                mobileInfoArea.style.height = heightPercent + '%';
                if (progress > 0.01) mobileInfoArea.style.overflowY = 'auto';
                else mobileInfoArea.style.overflowY = 'hidden';
            }

            checkBuyButtonVisibility();
        }

        function checkBuyButtonVisibility() {
            if (!mobileBuyFixed) return;
            mobileBuyFixed.style.opacity = '1';
            mobileBuyFixed.style.pointerEvents = 'auto';
        }

        // ==========================================
        // 微信二维码弹窗
        // ==========================================
        function openWxQR() {
            document.getElementById('wxQrModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function closeWxQR() {
            document.getElementById('wxQrModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ==========================================
        // 购买弹窗
        // ==========================================
        function openPurchase(artIdx, verIdx) {
            purchaseArtIdx = artIdx;
            purchaseVer = verIdx || 0;
            purchaseTier = 0;
            purchasePay = 0;
            const w = works[artIdx];
            document.getElementById('purchaseName').textContent = w.name;
            document.getElementById('purchaseNum').textContent = w.num;
            document.getElementById('purchaseNoteCode').textContent = w.num;
            updatePurchaseThumb();
            renderPurchaseVersions();
            renderPurchaseTiers();
            document.getElementById('qrWx').style.display = 'block';
            document.getElementById('qrAli').style.display = 'none';
            document.querySelectorAll('.pay-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
            document.getElementById('purchaseModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function openPurchaseFromLB() {
            openPurchase(cur, curVer);
        }

        function closePurchaseModal() {
            document.getElementById('purchaseModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function updatePurchaseThumb() {
            const w = works[purchaseArtIdx];
            const v = w.versions[purchaseVer];
            const thumbImg = document.getElementById('purchaseThumb');
            setImageWithBlur(thumbImg, v.src);
        }

        function renderPurchaseVersions() {
            const w = works[purchaseArtIdx];
            const container = document.getElementById('purchaseVersionSwitch');
            if (!w || !w.versions || w.versions.length <= 1) { container.innerHTML = ''; return; }
            container.innerHTML = w.versions.map((v, i) =>
                `<button class="v-switch-btn${i===purchaseVer?' active':''}" onclick="switchPurchaseVersion(${i})">${i === 0 ? '竖' : '横'}</button>`
            ).join('');
        }

        function switchPurchaseVersion(idx) {
            if (idx === purchaseVer) return;
            purchaseVer = idx;
            updatePurchaseThumb();
            document.querySelectorAll('.v-switch-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        }

        function renderPurchaseTiers() {
            const w = works[purchaseArtIdx];
            const container = document.getElementById('purchaseTiers');
            container.innerHTML = tierNames.map((name, i) => `
                    <div class="p-tier">
                        <div class="p-tier-name">${name}</div>
                        <div class="p-tier-spec">${i===0?'1080P 高清原图': i===1?'带实木相框装裱':'艺术微喷实体装裱'}</div>
                        <div class="p-tier-price">¥${w.prices[i]}</div>
                    </div>
                `).join('');
        }

        function switchPurchasePay(idx) {
            purchasePay = idx;
            document.getElementById('qrWx').style.display = idx === 0 ? 'block' : 'none';
            document.getElementById('qrAli').style.display = idx === 1 ? 'block' : 'none';
            document.querySelectorAll('.pay-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        }

        // ─── 键盘事件 ───
        document.addEventListener('keydown', e => {
            const purchaseActive = document.getElementById('purchaseModal').classList.contains('active');
            const wxActive = document.getElementById('wxQrModal').classList.contains('active');
            const lbActive = document.getElementById('lightbox').classList.contains('active');

            if (purchaseActive) {
                if (e.key === 'Escape') closePurchaseModal();
                return;
            }
            if (wxActive) {
                if (e.key === 'Escape') closeWxQR();
                return;
            }
            if (!lbActive) return;
            if (isMobile) {
                if (e.key === 'Escape') closeLB();
                return;
            }
            if (e.key === 'ArrowLeft') nav(-1);
            if (e.key === 'ArrowRight') nav(1);
            if (e.key === 'Escape') closeLB();
        });

        // ─── PC 触摸左右切换 ───
        let tx = 0;
        document.getElementById('lightbox').addEventListener('touchstart', e => {
            if (isMobile) return;
            tx = e.touches[0].clientX;
        }, { passive: true });

        document.getElementById('lightbox').addEventListener('touchend', e => {
            if (isMobile) return;
            if (document.getElementById('purchaseModal').classList.contains('active')) return;
            const dx = e.changedTouches[0].clientX - tx;
            if (Math.abs(dx) > 55) nav(dx < 0 ? 1 : -1);
        });

        // ─── 手机端侧滑/返回键拦截处理 ───
        window.addEventListener('popstate', () => {
            const purchaseModal = document.getElementById('purchaseModal');
            const wxQrModal = document.getElementById('wxQrModal');
            const lightbox = document.getElementById('lightbox');

            // 若弹窗开启，优先关闭购买弹窗
            if (purchaseModal && purchaseModal.classList.contains('active')) {
                closePurchaseModal();
                return;
            }
            // 若微信客服二维码开启，关闭客服弹窗
            if (wxQrModal && wxQrModal.classList.contains('active')) {
                closeWxQR();
                return;
            }
            // 若大图灯箱开启，关闭大图返回首页
            if (lightbox && lightbox.classList.contains('active')) {
                closeLB(true);
            }
        });

        // ─── 启动 ───
        window.addEventListener('DOMContentLoaded', loadWorksFromGitHub);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1100) {
                isMobile = false;
            } else {
                isMobile = true;
            }
        });

        document.querySelector('.wx-qr-bg').addEventListener('click', closeWxQR);

        const purchaseBgEl = document.querySelector('.purchase-bg');
        if (purchaseBgEl) {
            purchaseBgEl.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });
        }
    </script>
</body>
</html>
