<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>熊猫创意 · 数字艺术作品展</title>
    <script src="https://cdn.jsdelivr.net/npm/blurhash@2.0.5/dist/blurhash.umd.js">
    </script>
    <style>
        /* ===== 全局 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        :root {
            --bg: #04040a;
            --bg2: #08080f;
            --bg3: #0d0d18;
            --gold: #c9a84c;
            --gold-l: #e8c97a;
            --gold-d: rgba(201, 168, 76, 0.1);
            --bamboo: #7c9f4b;
            --t1: #ede9e3;
            --t2: #6e6a78;
            --t3: #302e3a;
            --b-gold: rgba(201, 168, 76, 0.14);
            --b-sub: rgba(255, 255, 255, 0.05);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--t1);
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
        }

        /* 禁用所有点击高亮 */
        a,
        button,
        div,
        img,
        span,
        svg,
        * {
            -webkit-tap-highlight-color: transparent !important;
            tap-highlight-color: transparent !important;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 55% 45% at 10% 20%, rgba(124, 159, 75, 0.04) 0%, transparent 65%),
                radial-gradient(ellipse 45% 55% at 90% 80%, rgba(201, 168, 76, 0.04) 0%, transparent 65%),
                radial-gradient(ellipse 35% 35% at 60% 40%, rgba(79, 195, 247, 0.02) 0%, transparent 55%);
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.018;
            background-image:
                linear-gradient(rgba(124, 159, 75, 1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 159, 75, 1) 1px, transparent 1px);
            background-size: 72px 72px;
        }

        /* ===== 顶部导航 ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 200;
            height: 66px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(4, 4, 10, 0.28);
            backdrop-filter: blur(32px) saturate(2);
            -webkit-backdrop-filter: blur(32px) saturate(2);
            border-bottom: 1px solid rgba(124, 159, 75, 0.12);
        }
        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                    transparent 0%, rgba(124, 159, 75, 0.5) 25%,
                    rgba(201, 168, 76, 0.6) 50%, rgba(124, 159, 75, 0.5) 75%, transparent 100%);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            height: 40px;
        }
        .logo-icon {
            position: relative;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }
        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1.5px solid var(--bamboo);
            border-radius: 50% 40% 50% 40%;
            transform: rotate(30deg);
            opacity: 0.8;
        }
        .logo-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--gold), var(--bamboo));
            transform: translate(-50%, -50%) rotate(45deg);
            border-radius: 2px;
        }
        .logo-words {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .logo-cn {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(90deg, var(--t1) 0%, var(--bamboo) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-en {
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--t2);
            margin-top: 1px;
        }

        .wechat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 12px;
            border: 2px solid var(--b-gold);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.35s ease;
            background: transparent;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            height: 40px;
            flex-shrink: 0;
        }
        .wechat-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--gold-d), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .wechat-btn:hover::before {
            opacity: 1;
        }
        .wechat-btn:hover {
            border-color: var(--gold);
        }
        .wechat-btn svg {
            width: 22px;
            height: 22px;
            fill: var(--gold-l);
            filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.4));
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        .wechat-words {
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            line-height: 1.2;
        }
        .wechat-tag {
            font-size: 8px;
            letter-spacing: 2px;
            color: var(--t2);
        }
        .wechat-id {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-l);
            letter-spacing: 1px;
        }

        /* ===== 分节标题 ===== */
        .sec-head {
            position: relative;
            z-index: 1;
            padding: 100px 52px 0;
            margin-bottom: 52px;
            display: flex;
            align-items: center;
            gap: 22px;
        }
        .sec-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--b-gold), transparent);
        }
        .sec-dmd {
            width: 7px;
            height: 7px;
            border: 1px solid var(--bamboo);
            transform: rotate(45deg);
            flex-shrink: 0;
        }
        .sec-words {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            text-align: center;
        }
        .sec-label {
            font-size: 9px;
            letter-spacing: 5px;
            color: var(--bamboo);
        }
        .sec-title {
            font-size: 20px;
            font-weight: 300;
            letter-spacing: 10px;
            color: var(--t1);
            padding-left: 10px;
        }

        /* ===== 作品网格 ===== */
        .gallery {
            position: relative;
            z-index: 1;
            padding: 0 52px 130px;
        }
        .g-grid {
            display: flex;
            align-items: flex-start;
            gap: 18px;
        }
        .g-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 0;
        }
        .art-card {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            background: var(--bg3);
            border: 1px solid var(--b-sub);
            transition: border-color 0.4s, box-shadow 0.4s;
            animation: fadeUp 0.7s ease both;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .art-card:hover {
            border-color: rgba(124, 159, 75, 0.35);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 40px rgba(124, 159, 75, 0.06);
        }
        .img-wrap {
            position: relative;
            overflow: hidden;
            width: 100%;
        }
        .img-wrap img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s;
            filter: brightness(0.9) saturate(0.95);
        }
        .art-card:hover .img-wrap img {
            transform: scale(1.05);
            filter: brightness(1.02) saturate(1.1);
        }

        .art-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 76px;
            background: rgba(180, 130, 70, 0.28);
            backdrop-filter: blur(3px) saturate(1.3);
            -webkit-backdrop-filter: blur(3px) saturate(1.3);
            border-top: 1px solid rgba(255, 230, 180, 0.35);
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 40%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            border-radius: 0 0 6px 6px;
        }
        .art-num {
            position: absolute;
            top: 13px;
            right: 13px;
            z-index: 4;
            width: 30px;
            height: 30px;
            border: 1px solid rgba(201, 168, 76, .35);
            background: rgba(4, 4, 10, .75);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            border-radius: 2px;
        }
        .art-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 85px;
            z-index: 3;
            pointer-events: none;
            padding: 14px 16px 14px 14px;
        }
        .art-series {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 3px;
            color: #f0d88a;
            margin-bottom: 6px;
        }
        .art-series::before {
            content: '';
            width: 14px;
            height: 1px;
            background: #e2c87a;
            opacity: 0.9;
        }
        .art-title-text {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 3px;
            color: var(--t1);
            margin-bottom: 3px;
            line-height: 1.3;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        .art-meta-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #ffe9b0;
            font-weight: 500;
        }
        .art-buy {
            position: absolute;
            bottom: 22px;
            right: 16px;
            z-index: 5;
            padding: 7px 16px;
            background: rgba(220, 180, 100, 0.18);
            backdrop-filter: blur(10px) saturate(1.4);
            -webkit-backdrop-filter: blur(10px) saturate(1.4);
            border: 1px solid rgba(220, 180, 100, 0.5);
            color: #fff6e0;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 4px;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            line-height: 1.2;
        }
        .art-buy:hover {
            background: rgba(220, 180, 100, 0.35);
            border-color: rgba(220, 180, 100, 0.8);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* ===== 灯箱 ===== */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }
        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }
        .lb-bg {
            position: absolute;
            inset: 0;
            background: rgba(2, 2, 6, 0.96);
            backdrop-filter: blur(28px);
        }
        .lb-layout {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: stretch;
        }
        .lb-nav {
            width: 88px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lb-nav-btn {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 15, 25, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #c9a84c;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            border-radius: 50%;
        }
        .lb-nav-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
        }
        .lb-nav-btn:hover {
            border-color: var(--bamboo);
            background: rgba(124, 159, 75, 0.2);
            color: var(--bamboo);
            box-shadow: 0 0 18px rgba(124, 159, 75, 0.25);
        }
        .lb-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 0 40px;
            overflow: hidden;
            position: relative;
        }
        .lb-card-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }
        .lb-card {
            position: relative;
            flex-shrink: 0;
            will-change: transform, opacity;
        }
        .lb-card img {
            display: block;
            max-width: 88vw;
            max-height: 84vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 4px;
            border: 1px solid rgba(124, 159, 75, 0.35);
            box-shadow: 0 48px 130px rgba(0, 0, 0, .85), 0 0 80px rgba(124, 159, 75, 0.06);
        }
        @keyframes zoomIn {
            from {
                transform: scale(0.88);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .lb-card.enter {
            animation: zoomIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes outLeft {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(-45%) scale(0.93);
                opacity: 0;
            }
        }
        @keyframes outRight {
            0% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(45%) scale(0.93);
                opacity: 0;
            }
        }
        @keyframes inFromRight {
            0% {
                transform: translateX(45%) scale(0.93);
                opacity: 0;
            }
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }
        @keyframes inFromLeft {
            0% {
                transform: translateX(-45%) scale(0.93);
                opacity: 0;
            }
            100% {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }
        .lb-card.out-l {
            animation: outLeft 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        .lb-card.out-r {
            animation: outRight 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
        }
        .lb-card.in-r {
            animation: inFromRight 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .lb-card.in-l {
            animation: inFromLeft 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .lb-version-bar {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            z-index: 10;
        }
        .lb-ver-btn {
            padding: 6px 18px;
            border: 1px solid var(--b-gold);
            background: rgba(4, 4, 10, 0.6);
            backdrop-filter: blur(10px);
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 2px;
            font-family: inherit;
        }
        .lb-ver-btn.active {
            background: rgba(124, 159, 75, 0.15);
            border-color: var(--bamboo);
            color: var(--bamboo);
        }
        .lb-dots {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 20px;
        }
        .lb-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all .3s;
        }
        .lb-dot.on {
            background: var(--bamboo);
            width: 10px;
            height: 10px;
            border-color: var(--bamboo);
            box-shadow: 0 0 10px rgba(124, 159, 75, 0.9);
        }

        /* PC 右侧面板 */
        .lb-panel {
            width: 310px;
            flex-shrink: 0;
            padding: 0 36px 0 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .lb-info {
            margin-bottom: 24px;
        }
        .lb-tag-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--bamboo);
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }
        .lb-tag-row::before {
            content: '';
            width: 18px;
            height: 1px;
            background: var(--bamboo);
        }
        .lb-ghost-num {
            font-size: 88px;
            font-weight: 200;
            line-height: 1;
            color: rgba(124, 159, 75, 0.12);
            margin-bottom: -10px;
            letter-spacing: -4px;
            user-select: none;
            z-index: 0;
            position: relative;
        }
        .lb-art-name {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 5px;
            color: var(--t1);
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }
        .lb-art-desc {
            font-size: 11px;
            color: var(--t2);
            letter-spacing: 1.5px;
            line-height: 2.1;
            margin-bottom: 18px;
        }
        .lb-art-chips {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .lb-chip {
            padding: 3px 10px;
            border: 1px solid var(--b-sub);
            font-size: 8px;
            letter-spacing: 2px;
            color: var(--t2);
            border-radius: 2px;
        }
        .lb-story {
            margin-top: 16px;
            border-top: 1px solid var(--b-sub);
            padding-top: 16px;
        }
        .lb-story-title {
            font-size: 9px;
            letter-spacing: 4px;
            color: var(--bamboo);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .lb-story-text {
            font-size: 11px;
            color: var(--t2);
            line-height: 1.9;
            letter-spacing: 1px;
        }
        .btn-collect {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: linear-gradient(135deg, var(--bamboo) 0%, #9bbf6a 100%);
            border: none;
            border-radius: 3px;
            color: #0a0f05;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
        }
        .btn-collect:hover {
            box-shadow: 0 8px 32px rgba(124, 159, 75, 0.45);
            transform: translateY(-1px);
        }

        .lb-close {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            width: 40px;
            height: 40px;
            border: 1px solid var(--b-sub);
            background: rgba(4, 4, 10, .55);
            color: var(--t2);
            cursor: pointer;
            font-size: 15px;
            backdrop-filter: blur(10px);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lb-close:hover {
            border-color: var(--bamboo);
            color: var(--bamboo);
        }

        /* ============================================================
           手机端专用 (宽度 < 1100px)
           ============================================================ */
        @media (max-width: 1100px) {

            .lb-nav,
            .lb-panel {
                display: none !important;
            }

            .lb-close {
                width: 48px;
                height: 48px;
                font-size: 20px;
                top: 12px;
                right: 12px;
                background: rgba(0, 0, 0, 0.55);
                border-color: rgba(255, 255, 255, 0.15);
                color: #fff;
                border-radius: 50%;
                z-index: 30;
                backdrop-filter: blur(8px);
                -webkit-tap-highlight-color: transparent !important;
            }
            .lb-close:active {
                border-color: var(--bamboo);
                color: var(--bamboo);
                transform: scale(0.92);
            }

            .lb-stage {
                padding: 0 !important;
                flex: 1;
                width: 100%;
                height: 100%;
                overflow: hidden;
                position: relative;
            }

            .lb-mobile-container {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
                touch-action: none;
                background: var(--bg);
            }

            /* ---- 图片区域 (顶部对齐) ---- */
            .lb-mobile-img-area {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                z-index: 5;
                will-change: transform;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent !important;
                pointer-events: auto;
            }
            .lb-mobile-img-area .lb-card {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                transform: translateY(0) scale(1);
                transform-origin: top center;
                will-change: transform;
                transition: none;
                position: relative;
            }
            .lb-mobile-img-area .lb-card img {
                max-width: 100vw;
                max-height: 100vh;
                width: auto;
                height: auto;
                object-fit: contain;
                border: none;
                box-shadow: none;
                border-radius: 0;
                display: block;
                max-width: 100%;
                max-height: 100%;
                -webkit-tap-highlight-color: transparent !important;
                transform-origin: top center;
            }

    <script>
        // ==========================================
        // 核心配置
        // ==========================================
        const GITHUB_USERNAME = "cc2026cc";
        const REPO_NAME = "szys";
        const API_BASE = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/熊猫创意`;

        let works = [];
        const tierNames = ['壁纸级数字版', '实体纸质版', '收藏级数字版'];
        let cur = 0,
            curVer = 0,
            busy = false;
        let purchaseArtIdx = 0,
            purchaseVer = 0,
            purchaseTier = 0,
            purchasePay = 0;

        const textDataDict = {
            "财神七仔": {
                desc: '七仔化身财神，金红交织的数字笔触中，憨态与祥瑞融为一体，传递出独特的东方美学与新春祝愿。',
                story: '传说中，大熊猫七仔曾梦见自己身披红袍、手捧元宝，行走于祥云之间。醒来后，它用画笔将梦境定格，每一道金色光芒都承载着对观者的美好祝愿。这幅作品历时三个月完成，是作者对传统文化与自然生灵的深情致敬。',
                chips: ['数字插画', '财神', '七仔', '祥瑞']
            },
            "弥勒七仔": {
                desc: '笑口常开的弥勒与七仔相遇，圆融的线条与柔和的色彩，展现出慈悲与喜乐的数字禅意。',
                story: '在一次山间小憩时，七仔偶遇一尊古老的弥勒石像，它被那永恒的微笑深深触动。于是，它决定用数字画笔重新诠释这份慈悲，让弥勒的圆融与熊猫的憨厚在光影中对话，传递出超越物种的宁静与喜悦。',
                chips: ['数字绘画', '弥勒', '七仔', '禅意']
            },
            "如来七仔": {
                desc: '七仔静坐莲台，宝相庄严中不失熊猫的纯真，光影在数字空间里构筑出神圣与自然的和谐。',
                story: '七仔一直对星空与哲学充满好奇。某个夜晚，它仰望银河，想象自己端坐于莲花之上，与宇宙融为一体。这幅作品正是那一刻的视觉化呈现，试图在庄严与天真之间找到完美的平衡点。',
                chips: ['数字艺术', '如来', '七仔', '庄严']
            }
        };
        const defaultText = {
            desc: '七仔主题数字艺术作品，融合东方美学与数字绘画，记录每一刻灵感。',
            story: '此作品的创作背景与幕后故事正在由作者精心整理中，敬请期待。',
            chips: ['数字艺术', '七仔', '插画'],
            prices: [49, 119, 199]
        };

        function setImageWithBlur(imgElement, highResSrc) {
            if (!imgElement) return;
            imgElement.src = highResSrc;
        }

        // ==========================================
        // 加载作品
        // ==========================================
        async function loadWorksFromGitHub() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<p style="color:#888; text-align:center; padding:40px; grid-column: span 12;">正在加载最新作品...</p>';

            let folders = [];
            const timestamp = new Date().getTime();

            try {
                const repoRes = await fetch(`${API_BASE}?t=${timestamp}`);
                if (repoRes.ok) {
                    folders = await repoRes.json();
                }
            } catch (e) {
                console.warn('动态读取目录超时，启用本地结构');
            }

            if (!Array.isArray(folders) || folders.length === 0) {
                folders = [
                    { name: '01财神七仔', type: 'dir' },
                    { name: '02弥勒七仔', type: 'dir' },
                    { name: '03如来七仔', type: 'dir' },
                    { name: '04悟空七仔', type: 'dir' },
                    { name: '05小女孩骑着七仔', type: 'dir' }
                ];
            }

            try {
                let sortedFolders = folders
                    .filter(item => item.type === 'dir' || item.name)
                    .sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

                const promises = sortedFolders.map(async (folder) => {
                    const folderName = folder.name;
                    let files = [];

                    try {
                        const folderUrl = `${API_BASE}/${encodeURIComponent(folderName)}?t=${timestamp}`;
                        const fileRes = await fetch(folderUrl);
                        if (fileRes.ok) {
                            const fileData = await fileRes.json();
                            files = fileData.map(f => f.name);
                        }
                    } catch (e) {}

                    if (files.length === 0) {
                        if (folderName.includes('01')) files = ['20260804财神七仔qsq01.webp', '20260804财神版七仔02.webp'];
                        else if (folderName.includes('02')) files = ['弥勒七仔mlq01.webp'];
                        else if (folderName.includes('03')) files = ['如来七仔rlq01.webp'];
                        else if (folderName.includes('04')) files = ['悟空七仔wqkz01.webp'];
                        else if (folderName.includes('05')) files = ['小女孩骑着七仔qzqz01.webp'];
                    }

                    let images = files.filter(f => ['jpg', 'jpeg', 'png', 'webp'].includes(f.split('.').pop().toLowerCase()));
                    if (images.length === 0) return null;
                    images.sort();

                    const firstImg = images[0];
                    const nameWithoutExt = firstImg.substring(0, firstImg.lastIndexOf('.'));
                    const match = nameWithoutExt.match(/([\u4e00-\u9fa5]+)([a-zA-Z0-9]*)$/);

                    let extractedName = folderName;
                    let extractedNum = '0000';
                    if (match) {
                        extractedName = match[1];
                        extractedNum = match[2] ? match[2].toUpperCase() : '0000';
                    }

                    const textData = textDataDict[extractedName] || defaultText;

                    const versions = images.map(imgName => {
                        const lower = imgName.toLowerCase();
                        const label = (lower.includes('横') || lower.includes('02')) ? '横版' : '竖版';
                        return {
                            src: `./熊猫创意/${folderName}/${imgName}`,
                            label: label
                        };
                    });

                    return {
                        name: extractedName,
                        series: '神话系列',
                        num: extractedNum,
                        desc: textData.desc,
                        story: textData.story,
                        chips: textData.chips,
                        prices: textData.prices || defaultText.prices,
                        versions: versions
                    };
                });

                works = (await Promise.all(promises)).filter(Boolean);
                renderGallery();
            } catch (err) {
                console.error('渲染异常:', err);
            }
        }

        // ==========================================
        // 首页网格渲染
        // ==========================================
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const colCount = window.innerWidth <= 900 ? 2 : 3;
            let cols = Array.from({ length: colCount }, () => []);

            works.forEach((w, i) => {
                const cardHTML = `
                <div class="art-card" style="animation-delay: ${i*0.1}s;" onclick="openLB(${i})">
                    <div class="img-wrap">
                        <img id="card-img-${i}" alt="${w.name}" loading="lazy" />
                    </div>
                    <div class="art-overlay"></div>
                    <div class="art-num">${String(i+1).padStart(2,'0')}</div>
                    <div class="art-info">
                        <div class="art-series">${w.series}</div>
                        <div class="art-title-text">${w.name}</div>
                        <div class="art-meta-text">${w.num}</div>
                    </div>
                    <button class="art-buy" onclick="event.stopPropagation(); openPurchase(${i},0)">购买收藏</button>
                </div>`;
                cols[i % colCount].push(cardHTML);
            });

            grid.innerHTML = cols.map(colHTML => `<div class="g-col">${colHTML.join('')}</div>`).join('');

            works.forEach((w, i) => {
                const imgEl = document.getElementById(`card-img-${i}`);
                const firstVer = w.versions[0];
                setImageWithBlur(imgEl, firstVer.src);
            });
        }

        let lastWindowWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => {
                if (window.innerWidth !== lastWindowWidth) {
                    lastWindowWidth = window.innerWidth;
                    if (works.length > 0) renderGallery();
                }
            }, 300);
        });

        // ==========================================
        // 灯箱控制
        // ==========================================
        let isMobile = false;
        let mobileExpanded = false;

        let touchStartY = 0;
        let touchCurrentY = 0;
        let touchStartTime = 0;
        let isDragging = false;
        let dragProgress = 0;
        let isAnimating = false;
        let touchOnInfoArea = false;
        let startProgress = 0;

        let mobileContainer = null;
        let mobileImgCard = null;
        let mobileImg = null;
        let mobileInfoArea = null;
        let mobileVersionSwitch = null;
        let mobileBuyFixed = null;

        // 手机布局参数
        const INIT_IMG_RATIO = 0.70;
        const MIN_IMG_RATIO = 0.30;
        const BUY_SHOW_PROGRESS = 0.30;

        function openLB(idx) {
            cur = idx;
            curVer = 0;
            isMobile = window.innerWidth < 1100;

            if (isMobile) {
                // 先清理可能残留的容器（解决退出后无法再次进入的问题）
                cleanupMobileContainer();

                setupMobileLightbox();
                fillMobileInfo(cur, curVer);
                const w = works[cur];
                const v = w.versions[curVer];
                const img = document.getElementById('lbImg');
                setImageWithBlur(img, v.src);
                // 重置状态
                mobileExpanded = false;
                dragProgress = 0;
                updateMobileTransform(0);
                if (mobileBuyFixed) {
                    mobileBuyFixed.classList.remove('visible');
                }
                renderMobileVersionSwitch();
                document.getElementById('lightbox').classList.add('active');
                document.body.style.overflow = 'hidden';
            } else {
                fillLB(idx, 0);
                buildDots();
                renderVersionBar();
                document.getElementById('lightbox').classList.add('active');
                document.body.style.overflow = 'hidden';
                const card = document.getElementById('lbCard');
                card.className = 'lb-card';
                void card.offsetWidth;
                card.classList.add('enter');
                card.addEventListener('animationend', () => card.classList.remove('enter'), { once: true });
            }
        }

        // 清理手机端容器
        function cleanupMobileContainer() {
            const container = document.getElementById('lbMobileContainer');
            if (container) {
                // 将 lbCard 移回 lbCardWrap
                const card = container.querySelector('.lb-card');
                const wrap = document.getElementById('lbCardWrap');
                if (card && wrap) {
                    wrap.appendChild(card);
                }
                container.remove();
            }
            const buyFixed = document.querySelector('.lb-mobile-buy-fixed');
            if (buyFixed) {
                buyFixed.remove();
            }
            // 重置引用
            mobileContainer = null;
            mobileImgCard = null;
            mobileImg = null;
            mobileInfoArea = null;
            mobileVersionSwitch = null;
            mobileBuyFixed = null;
        }

        function closeLB() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
            isDragging = false;
            isAnimating = false;
            touchOnInfoArea = false;
            // 如果是手机模式，清理容器
            if (isMobile) {
                cleanupMobileContainer();
            }
        }

        function fillLB(idx, verIdx) {
            const w = works[idx];
            const v = w.versions[verIdx];
            const lbImg = document.getElementById('lbImg');
            setImageWithBlur(lbImg, v.src);

            document.getElementById('lbSeries').textContent = w.series;
            document.getElementById('lbGhost').textContent = w.num;
            document.getElementById('lbName').textContent = w.name;
            document.getElementById('lbDesc').textContent = w.desc;
            document.getElementById('lbChips').innerHTML = w.chips.map(c => `<span class="lb-chip">${c}</span>`).join('');
            document.getElementById('lbStory').textContent = w.story;
            document.querySelectorAll('.lb-dot').forEach((d, i) => d.classList.toggle('on', i === idx));
            document.querySelectorAll('.lb-ver-btn').forEach((b, i) => b.classList.toggle('active', i === verIdx));
        }

        function buildDots() {
            document.getElementById('lbDots').innerHTML = works.map((_, i) =>
                `<div class="lb-dot${i===cur?' on':''}" onclick="jumpTo(${i})"></div>`
            ).join('');
        }

        function renderVersionBar() {
            const bar = document.getElementById('lbVersionBar');
            const w = works[cur];
            bar.innerHTML = w.versions.length > 1 ? w.versions.map((v, i) =>
                `<button class="lb-ver-btn${i===curVer?' active':''}" onclick="switchLBVersion(${i})">${v.label}</button>`
            ).join('') : '';
        }

        function switchLBVersion(verIdx) {
            if (busy || verIdx === curVer) return;
            curVer = verIdx;
            const v = works[cur].versions[verIdx];
            setImageWithBlur(document.getElementById('lbImg'), v.src);
            document.querySelectorAll('.lb-ver-btn').forEach((b, i) => b.classList.toggle('active', i === verIdx));
            if (isMobile) {
                const img = document.querySelector('.lb-mobile-img-area #lbImg');
                if (img) setImageWithBlur(img, v.src);
                renderMobileVersionSwitch();
                // 保持当前进度
                updateMobileTransform(dragProgress);
            }
        }

        function nav(dir) {
            if (isMobile) return;
            if (!busy) jumpTo((cur + dir + works.length) % works.length, dir);
        }

        function jumpTo(next, dir) {
            if (busy || next === cur || isMobile) return;
            busy = true;
            const d = dir !== undefined ? dir : (next > cur ? 1 : -1);
            const card = document.getElementById('lbCard');
            const outC = d > 0 ? 'out-l' : 'out-r',
                inC = d > 0 ? 'in-r' : 'in-l';
            card.className = 'lb-card ' + outC;
            card.addEventListener('animationend', function h() {
                card.removeEventListener('animationend', h);
                cur = next;
                curVer = 0;
                fillLB(cur, 0);
                renderVersionBar();
                card.className = 'lb-card';
                void card.offsetWidth;
                card.classList.add(inC);
                card.addEventListener('animationend', function h2() {
                    card.removeEventListener('animationend', h2);
                    card.classList.remove(inC);
                    busy = false;
                });
            });
        }

        // ==========================================
        // 手机模式
        // ==========================================

        function setupMobileLightbox() {
            const stage = document.getElementById('lbStage');

            // 创建容器
            const container = document.createElement('div');
            container.id = 'lbMobileContainer';
            container.className = 'lb-mobile-container';

            // 图片区域
            const imgArea = document.createElement('div');
            imgArea.className = 'lb-mobile-img-area';
            imgArea.onclick = function(e) {
                if (mobileExpanded) {
                    collapseMobileInfo();
                }
            };
            // 将 lbCard 从 lbCardWrap 移动到 imgArea
            const card = document.getElementById('lbCard');
            const wrap = document.getElementById('lbCardWrap');
            if (card && wrap) {
                // 清理 wrap 内可能存在的其他子节点
                wrap.innerHTML = '';
                wrap.appendChild(card); // 先放回去，再移动？
                // 实际上直接移动
                imgArea.appendChild(card);
            }
            container.appendChild(imgArea);

            // 版本切换按钮
            const verSwitch = document.createElement('div');
            verSwitch.className = 'lb-mobile-version-switch';
            verSwitch.id = 'lbMobileVersionSwitch';
            container.appendChild(verSwitch);

            // 信息区域
            const infoArea = document.createElement('div');
            infoArea.className = 'lb-mobile-info-area';
            infoArea.id = 'lbMobileInfoArea';
            container.appendChild(infoArea);

            // 清空 stage 并添加容器
            while (stage.firstChild) {
                stage.removeChild(stage.firstChild);
            }
            stage.appendChild(container);

            // 创建购买按钮（固定底部，默认隐藏）
            let buyFixed = document.querySelector('.lb-mobile-buy-fixed');
            if (!buyFixed) {
                buyFixed = document.createElement('div');
                buyFixed.className = 'lb-mobile-buy-fixed';
                const btn = document.createElement('button');
                btn.innerHTML = '<span class="btn-dot"></span> 购买收藏';
                btn.onclick = function(e) {
                    e.stopPropagation();
                    openPurchaseFromLB();
                };
                buyFixed.appendChild(btn);
                const lightbox = document.getElementById('lightbox');
                lightbox.appendChild(buyFixed);
            }

            // 缓存引用
            mobileContainer = container;
            mobileImgCard = document.querySelector('.lb-mobile-img-area .lb-card');
            mobileImg = document.querySelector('.lb-mobile-img-area #lbImg');
            mobileInfoArea = document.getElementById('lbMobileInfoArea');
            mobileVersionSwitch = document.getElementById('lbMobileVersionSwitch');
            mobileBuyFixed = document.querySelector('.lb-mobile-buy-fixed');

            // 绑定触摸事件
            container.addEventListener('touchstart', onTouchStart, { passive: true });
            container.addEventListener('touchmove', onTouchMove, { passive: false });
            container.addEventListener('touchend', onTouchEnd, { passive: true });

            fillMobileInfo(cur, curVer);
            renderMobileVersionSwitch();
        }

        function collapseMobileInfo() {
            if (!mobileExpanded) return;
            mobileExpanded = false;
            const targetProgress = 0;
            if (mobileImgCard) {
                mobileImgCard.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            }
            if (mobileInfoArea) {
                mobileInfoArea.style.transition = 'height 0.5s cubic-bezier(0.16, 1, 0.3, 1), top 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            }
            if (mobileBuyFixed) {
                mobileBuyFixed.classList.remove('visible');
            }
            isAnimating = true;
            updateMobileTransform(0);
            setTimeout(() => {
                isAnimating = false;
            }, 550);
            dragProgress = 0;
        }

        function fillMobileInfo(idx, verIdx) {
            const w = works[idx];
            const infoArea = document.getElementById('lbMobileInfoArea');
            if (!infoArea) return;

            const chipsHTML = w.chips.map(c => `<span class="mi-chip">${c}</span>`).join('');

            infoArea.innerHTML = `
                <div class="info-inner">
                    <div class="mi-title">${w.name}</div>
                    <div class="mi-num">${w.num}</div>
                    <div class="mi-desc">${w.desc}</div>
                    <div class="mi-chips">${chipsHTML}</div>
                    <div class="mi-story-title">设计故事</div>
                    <div class="mi-story-text">${w.story}</div>
                </div>
            `;
            // 确保图片已设置
            const img = document.querySelector('.lb-mobile-img-area #lbImg');
            if (img) {
                const v = w.versions[verIdx];
                setImageWithBlur(img, v.src);
            }
        }

        function renderMobileVersionSwitch() {
            const w = works[cur];
            const container = document.getElementById('lbMobileVersionSwitch');
            if (!container) return;
            if (w.versions.length <= 1) {
                container.innerHTML = '';
                return;
            }
            const labelMap = { '竖版': '竖', '横版': '横' };
            container.innerHTML = w.versions.map((v, i) =>
                `<button class="${i===curVer?'active':''}" onclick="switchLBVersion(${i})">${labelMap[v.label] || v.label}</button>`
            ).join('');
        }

        // ─── 触摸处理 ───

        const DRAG_THRESHOLD = 10;

        function onTouchStart(e) {
            if (e.touches.length !== 1) return;

            const touch = e.touches[0];
            const infoEl = document.getElementById('lbMobileInfoArea');
            if (infoEl) {
                const rect = infoEl.getBoundingClientRect();
                if (touch.clientY >= rect.top && touch.clientY <= rect.bottom &&
                    touch.clientX >= rect.left && touch.clientX <= rect.right) {
                    touchOnInfoArea = true;
                    return;
                }
            }
            touchOnInfoArea = false;

            if (isAnimating) {
                isAnimating = false;
                const target = mobileExpanded ? 1 : 0;
                dragProgress = target;
                updateMobileTransform(target);
                return;
            }

            touchStartY = e.touches[0].clientY;
            touchCurrentY = touchStartY;
            touchStartTime = Date.now();
            isDragging = false;
            startProgress = dragProgress;
            if (mobileImgCard) {
                mobileImgCard.style.transition = 'none';
            }
            if (mobileInfoArea) {
                mobileInfoArea.style.transition = 'none';
            }
        }

        function onTouchMove(e) {
            if (e.touches.length !== 1) return;
            if (touchOnInfoArea) {
                return;
            }

            const dy = e.touches[0].clientY - touchStartY;
            touchCurrentY = e.touches[0].clientY;

            if (!isDragging) {
                if (Math.abs(dy) > DRAG_THRESHOLD) {
                    isDragging = true;
                } else {
                    return;
                }
            }

            e.preventDefault();

            const maxDy = window.innerHeight * 0.6;
            const delta = -dy / maxDy;
            let progress = startProgress + delta;
            progress = Math.min(1, Math.max(0, progress));

            dragProgress = progress;
            updateMobileTransform(progress);
        }

        function onTouchEnd(e) {
            if (touchOnInfoArea) {
                touchOnInfoArea = false;
                return;
            }

            if (!isDragging) {
                return;
            }

            const dy = touchCurrentY - touchStartY;
            const dt = Date.now() - touchStartTime;
            const speed = Math.abs(dy) / dt;

            let targetProgress = dragProgress;
            if (speed > 0.3) {
                if (dy < 0) {
                    targetProgress = Math.min(1, dragProgress + 0.2);
                } else if (dy > 0) {
                    targetProgress = Math.max(0, dragProgress - 0.2);
                }
            }
            if (targetProgress > 0.85) targetProgress = 1;
            if (targetProgress < 0.15) targetProgress = 0;

            mobileExpanded = (targetProgress >= 0.5);

            if (mobileImgCard) {
                mobileImgCard.style.transition = 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            }
            if (mobileInfoArea) {
                mobileInfoArea.style.transition = 'height 0.5s cubic-bezier(0.16, 1, 0.3, 1), top 0.5s cubic-bezier(0.16, 1, 0.3, 1)';
            }
            if (targetProgress >= BUY_SHOW_PROGRESS) {
                if (mobileBuyFixed) mobileBuyFixed.classList.add('visible');
            } else {
                if (mobileBuyFixed) mobileBuyFixed.classList.remove('visible');
            }

            isAnimating = true;
            updateMobileTransform(targetProgress);
            setTimeout(() => {
                isAnimating = false;
            }, 550);

            isDragging = false;
            dragProgress = targetProgress;
        }

        function updateMobileTransform(progress) {
            // 计算缩放比例
            const scale = 1 - progress * (1 - MIN_IMG_RATIO / INIT_IMG_RATIO);
            if (mobileImgCard) {
                mobileImgCard.style.transform = `scale(${scale})`;
            }

            // 计算图片实际高度占屏幕比例
            const imgHeightRatio = INIT_IMG_RATIO * scale;
            if (mobileInfoArea) {
                const topPercent = imgHeightRatio * 100;
                const heightPercent = 100 - topPercent;
                mobileInfoArea.style.top = topPercent + '%';
                mobileInfoArea.style.height = heightPercent + '%';
                if (progress > 0.01) {
                    mobileInfoArea.style.overflowY = 'auto';
                } else {
                    mobileInfoArea.style.overflowY = 'hidden';
                }
            }

            if (mobileBuyFixed) {
                if (progress >= BUY_SHOW_PROGRESS) {
                    mobileBuyFixed.classList.add('visible');
                } else {
                    mobileBuyFixed.classList.remove('visible');
                }
            }
        }

        // ==========================================
        // 微信二维码弹窗
        // ==========================================
        function openWxQR() {
            document.getElementById('wxQrModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeWxQR() {
            document.getElementById('wxQrModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // ==========================================
        // 购买弹窗
        // ==========================================
        function openPurchase(artIdx, verIdx) {
            purchaseArtIdx = artIdx;
            purchaseVer = verIdx || 0;
            purchaseTier = 0;
            purchasePay = 0;
            const w = works[artIdx];
            document.getElementById('purchaseName').textContent = w.name;
            document.getElementById('purchaseNum').textContent = w.num;
            document.getElementById('purchaseNoteCode').textContent = w.num;
            updatePurchaseThumb();
            renderPurchaseVersions();
            renderPurchaseTiers();
            document.getElementById('qrWx').style.display = 'block';
            document.getElementById('qrAli').style.display = 'none';
            document.querySelectorAll('.pay-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
            document.getElementById('purchaseModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function openPurchaseFromLB() {
            openPurchase(cur, curVer);
        }

        function closePurchaseModal() {
            document.getElementById('purchaseModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function updatePurchaseThumb() {
            const w = works[purchaseArtIdx];
            const v = w.versions[purchaseVer];
            const thumbImg = document.getElementById('purchaseThumb');
            setImageWithBlur(thumbImg, v.src);
        }

        function renderPurchaseVersions() {
            const w = works[purchaseArtIdx];
            const container = document.getElementById('purchaseVersionSwitch');
            if (w.versions.length <= 1) { container.innerHTML = ''; return; }
            container.innerHTML = w.versions.map((v, i) =>
                `<button class="v-switch-btn${i===purchaseVer?' active':''}" onclick="switchPurchaseVersion(${i})">${v.label}</button>`
            ).join('');
        }

        function switchPurchaseVersion(idx) {
            if (idx === purchaseVer) return;
            purchaseVer = idx;
            updatePurchaseThumb();
            document.querySelectorAll('.v-switch-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        }

        function renderPurchaseTiers() {
            const w = works[purchaseArtIdx];
            const container = document.getElementById('purchaseTiers');
            container.innerHTML = tierNames.map((name, i) => `
                    <div class="p-tier">
                        <div class="p-tier-name">${name}</div>
                        <div class="p-tier-spec">${i===0?'1080P 高清': i===1?'6寸精印含顺丰':'2K 超清无损'}</div>
                        <div class="p-tier-price">¥${w.prices[i]}</div>
                    </div>
                `).join('');
        }

        function switchPurchasePay(idx) {
            purchasePay = idx;
            document.getElementById('qrWx').style.display = idx === 0 ? 'block' : 'none';
            document.getElementById('qrAli').style.display = idx === 1 ? 'block' : 'none';
            document.querySelectorAll('.pay-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        }

        // ─── 键盘事件 ───
        document.addEventListener('keydown', e => {
            const purchaseActive = document.getElementById('purchaseModal').classList.contains('active');
            const wxActive = document.getElementById('wxQrModal').classList.contains('active');
            const lbActive = document.getElementById('lightbox').classList.contains('active');

            if (purchaseActive) {
                if (e.key === 'Escape') closePurchaseModal();
                return;
            }
            if (wxActive) {
                if (e.key === 'Escape') closeWxQR();
                return;
            }
            if (!lbActive) return;
            if (isMobile) {
                if (e.key === 'Escape') closeLB();
                return;
            }
            if (e.key === 'ArrowLeft') nav(-1);
            if (e.key === 'ArrowRight') nav(1);
            if (e.key === 'Escape') closeLB();
        });

        // ─── PC 触摸左右切换 ───
        let tx = 0;
        document.getElementById('lightbox').addEventListener('touchstart', e => {
            if (isMobile) return;
            tx = e.touches[0].clientX;
        }, { passive: true });

        document.getElementById('lightbox').addEventListener('touchend', e => {
            if (isMobile) return;
            if (document.getElementById('purchaseModal').classList.contains('active')) return;
            const dx = e.changedTouches[0].clientX - tx;
            if (Math.abs(dx) > 55) nav(dx < 0 ? 1 : -1);
        });

        // ─── 启动 ───
        window.addEventListener('DOMContentLoaded', loadWorksFromGitHub);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1100) {
                isMobile = false;
            } else {
                isMobile = true;
            }
        });

        // 点击微信二维码弹窗背景关闭
        document.querySelector('.wx-qr-bg').addEventListener('click', closeWxQR);
    </script>
</body>
</html>
