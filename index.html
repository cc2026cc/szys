<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊猫创意 · 数字艺术作品展</title>
    <style>
        /* ═══════════════════════════════════════════
           您之前所有的 CSS 样式（完全不变）
        ═══════════════════════════════════════════ */
        /* 由于回复长度限制，这里省略了您的完整 CSS，请务必使用您原本完整的 CSS 粘贴到此位置 */
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="bg-grid"></div>

    <header class="header">
        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-words">

        </div>
        <div class="wechat-btn">
            <svg viewBox="0 0 24 24" width="17" height="17">
                <path d="M8.9 2C4.3 2 .6 5.1 .6 8.9c0 2.1 1.1 4 2.8 5.2a.55.55 0 0 1 .2.6l-.4 1.4a.27.27 0 0 0 .28.34c.06 0 .12-.02.16-.05l1.8-1.05a.8.8 0 0 1 .67-.1c.85.25 1.76.38 2.68.38.26 0 .51-.02.76-.05-.8-2.44.15-4.7 1.82-6.1C12.8 8.3 14.9 7.8 16.8 7.9 16.2 4.6 12.9 2 8.9 2zM6.2 5.5c.6 0 1.1.5 1.1 1.1a1.1 1.1 0 0 1-2.2 0c0-.6.5-1.1 1.1-1.1zm5.4 0c.6 0 1.1.5 1.1 1.1a1.1 1.1 0 0 1-2.2 0c0-.6.5-1.1 1.1-1.1zm5.1 2.7c-1.7-.05-3.5.48-4.9 1.68-1.6 1.35-2.5 3.5-1.7 5.86.9 2.3 3.4 3.98 6.4 3.98.78 0 1.53-.11 2.23-.32a.68.68 0 0 1 .56.08l1.49.87a.26.26 0 0 0 .27-.19l-.31-1.16a.55.55 0 0 1 .19-.5c1.2-.93 2.1-2.5 2.1-4.2 0-3-2.7-5.5-6.6-5.8zm-3.5 2.5c.47 0 .85.38.85.85a.85.85 0 1 1-1.7 0c0-.47.38-.85.85-.85zm5.4 0c.47 0 .85.38.85.85a.85.85 0 1 1-1.7 0c0-.47.38-.85.85-.85z" fill="#c9a84c" />
            </svg>
            <div class="wechat-words">
                <span class="wechat-tag">微信客服</span>
                <span class="wechat-id">PandaArt_7</span>
            </div>
        </div>
    </header>

    <div class="sec-head">
        <div class="sec-line"></div>
        <div class="sec-dmd"></div>
        <div class="sec-words">
            <span class="sec-label">作品全览</span>
            <span class="sec-title">熊猫创意</span>
        </div>
        <div class="sec-dmd"></div>
        <div class="sec-line"></div>
    </div>

    <section class="gallery">
        <div class="g-grid" id="galleryGrid"></div>
    </section>

    <footer class="footer" style="position: relative; z-index: 1; padding: 56px 52px; border-top: 1px solid rgba(124, 159, 75, 0.12); display: flex; align-items: center; justify-content: space-between;">
        <div>
            <div style="font-size: 17px; font-weight: 300; letter-spacing: 8px; color: var(--t2); margin-bottom: 7px;">熊猫创意</div>
            <div style="font-size: 9px; letter-spacing: 2px; color: var(--t3);">© 2024 · 七仔数字艺术 · 未经授权不得转载或商用</div>
        </div>
        <div style="font-size: 9px; letter-spacing: 2px; color: var(--t3);">三件限量作品 · 三种收藏规格</div>
    </footer>

    <!-- ═══ 灯箱 (预览) ═══ -->
    <div class="lightbox" id="lightbox">
        <div class="lb-bg" onclick="closeLB()"></div>
        <div class="lb-layout">
            <div class="lb-nav"><button class="lb-nav-btn" onclick="nav(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"></polyline></svg></button></div>
            <div class="lb-stage">
                <div class="lb-card-wrap"><div class="lb-card" id="lbCard"><img id="lbImg" src="" alt="" /></div></div>
                <div class="lb-version-bar" id="lbVersionBar"></div>
                <div class="lb-dots" id="lbDots"></div>
            </div>
            <div class="lb-nav"><button class="lb-nav-btn" onclick="nav(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button></div>
            <div class="lb-panel">
                <div class="lb-info">
                    <div class="lb-tag-row" id="lbSeries">神话系列</div>
                    <div class="lb-ghost-num" id="lbGhost">01</div>
                    <div class="lb-art-name" id="lbName">财神七仔</div>
                    <div class="lb-art-desc" id="lbDesc"></div>
                    <div class="lb-art-chips" id="lbChips"></div>
                </div>
                <div class="lb-story">
                    <div class="lb-story-title">设计故事</div>
                    <div class="lb-story-text" id="lbStory">故事的细节将在此呈现。</div>
                </div>
                <button class="btn-collect" onclick="openPurchaseFromLB()">购买收藏</button>
            </div>
        </div>
        <button class="lb-close" onclick="closeLB()">✕</button>
    </div>

    <!-- ═══ 购买弹窗 (横版+毛玻璃) ═══ -->
    <div class="purchase-modal" id="purchaseModal">
        <div class="purchase-bg" onclick="closePurchaseModal()"></div>
        <div class="purchase-box">
            <button class="purchase-close" onclick="closePurchaseModal()">✕</button>
            <div class="purchase-left">
                <div class="purchase-thumb"><img id="purchaseThumb" src="" alt="作品缩略图" /></div>
                <div class="purchase-name" id="purchaseName">财神七仔</div>
                <div class="purchase-num" id="purchaseNum">QSQ01</div>
                <div class="version-switch" id="purchaseVersionSwitch"></div>
            </div>
            <div class="purchase-right">
                <div class="purchase-note-highlight" id="purchaseNote">
                    <span class="warn-icon">⚠</span> 付款备注：<strong id="purchaseNoteCode">QSQ01</strong> + （邮箱/微信/QQ）三选一，或收件地址<br>勿必填写付款备注，以便我第一时间发送文件
                </div>
                <div class="tier-row" id="purchaseTiers"></div>
                <div class="pay-switch">
                    <button class="pay-btn active" onclick="switchPurchasePay(0)">微信支付</button>
                    <button class="pay-btn" onclick="switchPurchasePay(1)">支付宝</button>
                </div>
                <div class="qr-code-img">
                    <img id="qrWx" src="微信.jpg" alt="微信收款码" style="display:block;" />
                    <img id="qrAli" src="支付宝.jpg" alt="支付宝收款码" style="display:none;" />
                </div>
                <div class="purchase-steps">
                    <div class="p-step"><span class="p-step-n">1</span>扫码付款</div>
                    <div class="p-step"><span class="p-step-n">2</span>备注编号+邮箱/地址</div>
                    <div class="p-step"><span class="p-step-n">3</span>24h内发货</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ══════════════════════════════════════
        //  GitHub 动态画廊配置
        // ══════════════════════════════════════
        const GITHUB_USERNAME = "cc2026cc";   // ← 改成你的
        const REPO_NAME = "szys";               // ← 改成你的仓库名
        const API_BASE = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/熊猫创意`;
        const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/熊猫创意`;
        
        // 全局作品数据（将由 API 动态填充）
        let works = [];
        let cur = 0, curVer = 0, busy = false;
        let purchaseArtIdx = 0, purchaseVer = 0, purchasePay = 0;
        
        // 默认值（如果 info.md 不存在，将使用这些）
        const defaultDesc = '七仔主题数字艺术作品，融合东方美学与数字绘画。';
        const defaultStory = '创作故事正在整理中，敬请期待。';
        const defaultSeries = '七仔系列';
        const defaultPrices = [49, 119, 199];
        const defaultTags = ['数字艺术', '七仔', '熊猫'];
        
        // ══════════════════════════════════════
        //  从 info.md 文本中提取元数据
        // ══════════════════════════════════════
        function parseInfoFile(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            const result = {
                name: '',
                series: defaultSeries,
                num: '',
                desc: defaultDesc,
                story: defaultStory,
                chips: defaultTags,
                prices: defaultPrices,
            };
            
            if (lines.length === 0) return result;
            
            // 第一行：标题
            result.name = lines[0].replace(/^#+\s*/, '').trim() || '未命名作品';
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('系列:') || line.startsWith('系列：')) {
                    result.series = line.split(/[:：]/)[1].trim();
                } else if (line.startsWith('编号:') || line.startsWith('编号：')) {
                    result.num = line.split(/[:：]/)[1].trim().toUpperCase();
                } else if (line.startsWith('价格:') || line.startsWith('价格：')) {
                    const prices = line.split(/[:：]/)[1].split(',').map(s => parseInt(s.trim()));
                    if (prices.length === 3) result.prices = prices;
                } else if (line.startsWith('标签:') || line.startsWith('标签：')) {
                    result.chips = line.split(/[:：]/)[1].split(',').map(s => s.trim());
                } else if (line.startsWith('描述:') || line.startsWith('描述：')) {
                    result.desc = line.split(/[:：]/).slice(1).join('：').trim();
                } else if (line.startsWith('故事:') || line.startsWith('故事：')) {
                    result.story = line.split(/[:：]/).slice(1).join('：').trim();
                }
            }
            return result;
        }
        
        // ══════════════════════════════════════
        //  从图片文件名中猜测版本标签
        // ══════════════════════════════════════
        function guessVersionLabel(filename) {
            const lower = filename.toLowerCase();
            if (lower.includes('横版') || lower.includes('横')) return '横版';
            if (lower.includes('竖版') || lower.includes('竖')) return '竖版';
            // 根据图片尺寸可进一步判断，这里简单返回空
            return '';
        }
        
        // ══════════════════════════════════════
        //  核心：动态加载作品列表 (已修复缓存与命名规则)
        // ══════════════════════════════════════
        async function loadWorksFromGitHub() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">正在从云端加载作品...</p>';
            
            try {
                // 1. 生成时间戳，打破 GitHub API 缓存限制，确保每次都读取最新增加的文件夹
                const timestamp = new Date().getTime();
                const res = await fetch(`${API_BASE}?t=${timestamp}`);
                if (!res.ok) throw new Error('无法访问仓库');
                const folders = await res.json();
                
                const promises = folders
                    .filter(item => item.type === 'dir')
                    .map(async (folder) => {
                        const folderName = folder.name;
                        // 给里面的文件请求也加上时间戳
                        const folderUrl = `${API_BASE}/${encodeURIComponent(folderName)}?t=${timestamp}`;
                        const fileRes = await fetch(folderUrl);
                        const files = await fileRes.json();
                        
                        // 提取图片文件和 info 文件
                        let images = [];
                        let infoContent = null;
                        
                        for (let file of files) {
                            const ext = file.name.split('.').pop().toLowerCase();
                            if (['jpg','jpeg','png','webp'].includes(ext)) {
                                images.push(file.name);
                            } else if (['md','txt'].includes(ext)) {
                                const infoUrl = `${RAW_BASE}/${encodeURIComponent(folderName)}/${encodeURIComponent(file.name)}?t=${timestamp}`;
                                const infoRes = await fetch(infoUrl);
                                infoContent = await infoRes.text();
                            }
                        }
                        
                        if (images.length === 0) return null;
                        
                        // 排序图片
                        images.sort();
                        
                        // 2. 核心修改：从第一张图片文件名提取纯汉字名称和后续编号
                        const firstImg = images[0];
                        // 去掉文件后缀名 (例如去掉 .jpg)
                        const nameWithoutExt = firstImg.substring(0, firstImg.lastIndexOf('.'));
                        
                        // 正则说明：匹配最后的连续汉字(作为标题)，以及它后面的字母数字(作为编号)
                        const match = nameWithoutExt.match(/([\u4e00-\u9fa5]+)([a-zA-Z0-9]*)$/);
                        let extractedName = folderName;
                        let extractedNum = '0000';
                        
                        if (match) {
                            extractedName = match[1]; // 提取到的汉字部分，例如 "财神七仔"
                            extractedNum = match[2] ? match[2].toUpperCase() : '0000'; // 汉字后面的编号，例如 "QSQ01"
                        }
                        
                        // 解析信息
                        let meta;
                        if (infoContent) {
                            meta = parseInfoFile(infoContent);
                            if (!meta.num) meta.num = extractedNum;
                            if (meta.name === '未命名作品' || !meta.name) meta.name = extractedName;
                        } else {
                            meta = { ...parseInfoFile(''), name: extractedName, num: extractedNum }; 
                        }
                        
                        // 构建版本列表
                        const versions = images.map(imgName => ({
                            src: `${RAW_BASE}/${encodeURIComponent(folderName)}/${encodeURIComponent(imgName)}`,
                            label: guessVersionLabel(imgName) || '默认版'
                        }));
                        
                        return {
                            ...meta,
                            versions,
                        };
                    });
                
                works = (await Promise.all(promises)).filter(Boolean);
                renderGallery();
                if (works.length === 0) {
                    grid.innerHTML = '<p style="color:#888; text-align:center;">暂无作品，请上传图片到 熊猫创意 文件夹。</p>';
                }
            } catch (err) {
                grid.innerHTML = '<p style="color:#c44; text-align:center;">加载失败，请稍后刷新。</p>';
                console.error(err);
            }
        }
        
        // ══════════════════════════════════════
        //  渲染画廊网格（与原来完全一致）
        // ══════════════════════════════════════
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = works.map((w, i) => {
                const thumb = w.versions[0].src;
                return `
                <div class="art-card" style="animation-delay: ${i*0.1}s;" onclick="openLB(${i})">
                    <div class="img-wrap"><img src="${thumb}" alt="${w.name}" loading="lazy" /></div>
                    <div class="art-overlay"></div>
                    <div class="art-num">${String(i+1).padStart(2,'0')}</div>
                    <div class="art-info">
                        <div class="art-series">${w.series}</div>
                        <div class="art-title-text">${w.name}</div>
                        <div class="art-meta-text">${w.num}</div>
                    </div>
                    <button class="art-buy" onclick="event.stopPropagation(); openPurchase(${i},0)">购买收藏</button>
                </div>`;
            }).join('');
        }
        
        // ══════════════════════════════════════
        //  以下所有函数（灯箱、购买、切换、键盘等）与您之前的代码完全相同
        //  请将您原来代码中从 renderGallery 定义之后的所有 JS 函数粘贴到这里
        //  但务必删除原来手动定义的 works 数组
        //  原函数包括：openLB, closeLB, fillLB, buildDots, renderVersionBar, switchLBVersion,
        //            nav, jumpTo, openPurchase, openPurchaseFromLB, closePurchaseModal,
        //            updatePurchaseThumb, renderPurchaseVersions, switchPurchaseVersion,
        //            renderPurchaseTiers, switchPurchasePay, 键盘监听等
        //  这些函数不用修改，直接复制过来即可。
        // ══════════════════════════════════════

        // 启动：页面加载时自动拉取作品
        window.addEventListener('DOMContentLoaded', loadWorksFromGitHub);
    </script>
</body>
</html>
